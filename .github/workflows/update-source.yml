# ==============================================================================
#  SideStore 源文件 apps.json 的自动更新（GitHub Actions 版）
#
#  ── 为什么要有这一份 ──────────────────────────────────────────────────────
#  原方案把自动更新放在 cnb.cool 的云原生构建里。问题是 CNB 免费额度只有
#  160 核时/月，而且构建开始前要「预冻结」5 分钟（0.08 核时）——额度见底时
#  所有构建直接失败。2026-09 就被 laincat/Rules 一个仓库把额度烧光了。
#
#  GitHub Actions 在公开仓库上**不计分钟数**，且原生直连 GitHub Release
#  （不需要任何镜像代理），是目前最省心的执行端。
#
#  ── 两种用法，靠 secret 是否存在自动切换 ─────────────────────────────────
#  1) 只更新本仓库（默认）——源地址用 GitHub 侧的直链
#  2) 再同步回 cnb.cool（可选）——额外配 CNB_TOKEN / CNB_USER 两个 secrets，
#     cnb.cool 那份就变成纯托管镜像，国内访问更快
#
#  ── 触发方式：为什么是「高频轮询」而不是「上游发版就触发」───────────────
#  理想做法是订阅那 6 个上游仓库的 release 事件，一发版就同步。但 GitHub
#  的 release 事件**只在事件发生的那个仓库里触发工作流**，跨仓库收不到 ——
#  除非上游主动往我们的 API 打 repository_dispatch，而给别人的仓库配 webhook
#  是我们做不到的（得有那个仓库的管理权限）。
#
#  所以实际可行的是**短间隔轮询**。官方约束（docs.github.com“Events that
#  trigger workflows”）：
#    · 定时任务最短间隔是 **5 分钟**
#    · 负载高时会延迟，甚至**丢弃排队中的任务**；整点前后负载最高，
#      官方建议「避开整点」→ 本文件用 7,22,37,52 就是刻意错开整点
#    · 定时任务只在**默认分支**上生效
#
#  本任务单次实测仅 **12 秒**（生成 5s + 提交 2s + 固定开销 5s），且公开仓库
#  的 Actions 分钟数免费不限量 → 15 分钟一轮约 96 次/天、总计约 20 分钟/天，
#  成本可忽略。轮询还有个好处：**偶尔被丢弃一轮完全无所谓**，下一轮会补上。
#
#  ── 配额/成本 ────────────────────────────────────────────────────────────
#  公开仓库的 Actions 分钟数免费且不限量。
#  15 分钟一轮 + 手动触发，对 GitHub 侧无任何成本。
#
#  ⚠️ 实测补充（2026-09-16）：cron 是 best-effort，而且「越密越丢」
#  拿三个仍在活跃使用 cron 的公开仓库做的对照：
#    · DIYgod/RSSHub         每天 1 次   → 连续 10 天 100%，迟到 +5~6 分
#    · home-assistant/core   每小时      → 基本不漏，但迟到 +11~15 分
#    · NixOS/nixpkgs         每 10 分钟  → 193 分钟里只跑了 10 次（应约 19 次），约 53%
#  结论：**密 cron 不是「更快」，是「更多次抽奖」。** 丢槽不累积（下一槽会补上），
#  所以轮询场景下反而该跑密一点 —— 前提是单次任务足够轻（本任务实测约 12 秒）。
#
#  ⚠️ 另一个坑：**新建的工作流，cron 要先「注册」**。GitHub 需要 15 分钟到
#  1 小时以上才会认领一个新的 schedule；在第一次 schedule 运行真正发生之前，
#  Actions 页面上只显示 "This workflow has a workflow_dispatch event trigger"，
#  看起来就像 schedule 根本没被解析。所以刚上线时「一个定时都没跑」是正常的，
#  别急着改配置。判断方法（**别盯 UI** —— Actions 页面正文是客户端渲染的，
#  curl 到的 HTML 里没有那句话）：
#    curl -s -H "Authorization: Bearer $TOKEN" \
#      "https://api.github.com/repos/laincat/AltStore/actions/runs?event=schedule"
#  返回 total_count = 0 就是还没被认领过。
#
#  ── 想做到「秒级」怎么办 ─────────────────────────────────────────────────
#  见下面 repository_dispatch 那段的注释。
# ==============================================================================

name: 更新 SideStore 源

on:
  # 每 15 分钟一次，刻意错开整点（7/22/37/52 分）。
  # Actions 的 cron 按 UTC 解释；轮询场景下时区无意义。
  schedule:
    - cron: "7,22,37,52 * * * *"

  # 手动触发（改了脚本或想立刻刷新时用）
  workflow_dispatch:

  # 给外部事件源留的入口：任何拿到本仓库 token 的服务都可以 POST
  #   https://api.github.com/repos/laincat/AltStore/dispatches
  #   {"event_type":"upstream-release"}
  # 打过来立刻跑一轮，不受 15 分钟间隔限制（想做真正的「发版即同步」时，
  # 可以用 Cloudflare Workers 的 1 分钟定时之类，去轮询上游 release 再打这个接口）。
  repository_dispatch:
    types: [upstream-release]

  # 只有"会改变生成结果"的改动才触发，避免改 README 也跑一轮
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/update-source.yml"

# 要把生成结果提交回本仓库，必须有写权限
permissions:
  contents: write

# 定时与手动触发可能撞车，串行化；不取消进行中的，避免推到一半被中断
concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 未配置时为：空字符串 → 下面的同步步骤会自动跳过
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_USER: ${{ secrets.CNB_USER }}
      CNB_REPO: laincat/AltStore

    steps:
      - name: 取出仓库
        uses: actions/checkout@v7
        with:
          # 需要能 push 回去
          persist-credentials: true
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 重新生成源文件
        run: |
          set -e
          # --refresh：重新问 GitHub 要最新 Release 列表；
          #           IPA 元数据仍走 cache/probes.json（已探过的版本不重复下载）
          python tools/build_source.py --refresh

      - name: 校验（不通过就整轮中止）
        run: |
          set -e
          # 某个 app 的 releases 变成空数组时 SideStore 解码会整体抛错，
          # 一个坏条目能让整个源加载不了，而这种情况肉眼看不出来 —— 必须卡住。
          python tools/verify_source.py --min-apps 6

      - name: 核对两个客户端的解析结果
        run: |
          set -e
          # 同一份 apps.json，两边读的字段完全不同：
          #   SideStore / AltStore → releaseChannels 里的轨道（beta 要用户手动开开关）
          #   LiveContainer        → 只读扁平 versions，且只取 [0]，没有开关也没有版本选择器
          # EhPanda 的测试版就是靠「扁平 versions[0]」送到 LiveContainer 的，
          # 一旦哪天生成逻辑改动把它挪走了，这里要能看出来。
          python tools/simulate_client.py --client sidestore
          python tools/simulate_client.py --client livecontainer

      - name: 提交到本仓库
        id: commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "上游无新版本，无变更"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(source): 自动更新 $(date -u '+%Y-%m-%d')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 发布/滚动更新 Release（固定 tag，永远只留一个）
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="latest"

          # ── 为什么是「固定 tag + 滚动覆盖」，而不是「一次内容一个 tag」──────
          # 本流水线每 15 分钟跑一轮。若每轮都建 tag/release，就是一天 96 个、
          # 一周 672 个 —— 另一个仓库踩过同款坑：tag 用构建时间戳，一次清掉
          # 1409 个。这里 tag 名永远叫 latest，只覆盖它下面的 asset，于是：
          #   · URL 永久稳定：/releases/download/latest/apps.json
          #   · tag / release 数量恒定为 1，不随时间膨胀
          # ─────────────────────────────────────────────────────────────

          exists=false
          if gh release view "$TAG" >/dev/null 2>&1; then exists=true; fi

          # 首次（release 还不存在）即使本轮无变化也要建一次，否则用户会以为没生效
          if [ "${{ steps.commit.outputs.changed }}" != "true" ] && [ "$exists" = "true" ]; then
            echo "apps.json 无变化且 release 已存在 → 跳过"
            exit 0
          fi

          # ⚠️ 用 git rev-parse HEAD，不要用 $GITHUB_SHA：
          #    schedule 触发时 GITHUB_SHA 是「触发那一刻」的提交，而上面刚产生
          #    了新提交（自动更新），两者不是同一个。用错会让 tag 指向旧树。
          SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$SHA"
          # tag push 不会触发本工作流（触发器限定了 branches: [main]，tag 不匹配）
          git push -f origin "refs/tags/$TAG"

          if [ "$exists" = "true" ]; then
            gh release upload "$TAG" apps.json --clobber
            echo "已滚动覆盖 asset：apps.json（tag ${TAG} -> ${SHA:0:7}）"
          else
            cat > /tmp/release-notes.md <<'EOF'
          本 release 的 tag 固定为 `latest`，其下的 `apps.json` 在每次内容变化后被覆盖。
          也就是说本页永远只有这一个 release，tag 指向当前内容所在的那个提交。

          一个永久稳定的备用下载地址：

          ```
          https://github.com/laincat/AltStore/releases/download/latest/apps.json
          ```

          注意：订阅这个源并不需要走 Release —— `raw.githubusercontent.com` 的直链
          一直是可用的。这里主要提供「点击下载」入口与内容快照。
          EOF
            gh release create "$TAG" apps.json \
              --title "最新源文件（滚动更新）" \
              --notes-file /tmp/release-notes.md \
              --latest
            echo "已创建 release：$TAG"
          fi

          echo "url=https://github.com/laincat/AltStore/releases/download/$TAG/apps.json" >> "$GITHUB_OUTPUT"

      - name: 同步到 cnb.cool（没配 secret 就跳过）
        if: ${{ env.CNB_TOKEN != '' }}
        run: |
          set -e

          # 凭据只在这条命令里临时注入：不写进 .git/config，不落盘。
          # 前面那个空的 -c credential.helper= 用来清掉系统级 helper。
          # 注意：token 里若有单引号会破坏这里的引号，CNB 的 cnb_at_ 令牌是
          # [A-Za-z0-9_-]，不含引号，安全。
          CRED='!f() { echo "username='"${CNB_USER}"'"; echo "password='"${CNB_TOKEN}"'"; }; f'

          # 做法是「克隆 cnb 侧 → 覆盖产物 → 提交推送」，而不是直接把 GitHub 的
          # 历史整段推过去。两个仓库的历史本来就不相关，硬推会被拒或需要 force；
          # 只同步产物则两边历史各自独立，永远不会有分叉冲突。
          rm -rf /tmp/cnb-mirror
          git -c credential.helper= -c credential.helper="$CRED" \
              clone -q "https://cnb.cool/${CNB_REPO}.git" /tmp/cnb-mirror

          cp apps.json /tmp/cnb-mirror/apps.json
          mkdir -p /tmp/cnb-mirror/cache /tmp/cnb-mirror/tools
          cp cache/*.json  /tmp/cnb-mirror/cache/
          cp tools/*.py    /tmp/cnb-mirror/tools/
          cp README.md     /tmp/cnb-mirror/README.md

          cd /tmp/cnb-mirror
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "cnb.cool 侧已是最新，无需同步"
            exit 0
          fi
          git commit -q -m "chore(source): 同步自 GitHub Actions $(date -u '+%Y-%m-%d')"
          git -c credential.helper= -c credential.helper="$CRED" push -q origin HEAD:main
          echo "已同步到 cnb.cool/${CNB_REPO}"

      - name: 小结
        if: always()
        run: |
          {
            echo "### 源文件更新结果"
            echo ""
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "- ✅ 有更新，已提交"
            else
              echo "- ⏸ 上游无新版本，未产生提交"
            fi
            echo "- cnb.cool 同步：${{ env.CNB_TOKEN != '' && '已启用' || '未配置（跳过）' }}"
            if [ -n "${{ steps.release.outputs.url }}" ]; then
              echo "- Release 地址（固定，滚动覆盖）：${{ steps.release.outputs.url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
