name: Dependabot validated merge

on:
  workflow_run:
    workflows: ["Dependency validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch code receives the write token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge verified patch/minor updates after CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_MERGE_WORKFLOW: "update-source.yml"
        run: python3 .github/scripts/dependabot_merge.py
