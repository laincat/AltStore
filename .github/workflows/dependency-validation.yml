name: Dependency validation
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - run: python -m unittest discover -s tests -v
    - run: python -m unittest discover -s .github/scripts
    - run: python -m compileall -q tools .github/scripts
    - run: python tools/verify_source.py --min-apps 18
    - run: python tools/simulate_client.py --client sidestore
    - run: python tools/simulate_client.py --client livecontainer

